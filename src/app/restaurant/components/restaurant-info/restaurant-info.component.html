<div class="info-card p-3 border rounded-3 mb-3" *ngIf="restaurant">
  <h6 class="fw-bold mb-2">📍 Restaurant Info</h6>
  <p class="mb-1 small"><strong>Address:</strong> {{ restaurant.address }}</p>
  <p class="mb-1 small"><strong>Email:</strong> {{ restaurant.email }}</p>
  <p class="mb-1 small"><strong>Phone:</strong> {{ restaurant.mobile }}</p>
  <p class="mb-0 small"><strong>Services:</strong> {{ restaurant.services }}</p>
</div>
