<div class="menu-item-card border rounded-3 overflow-hidden h-100" [class.unavailable]="!item.available">
  <img *ngIf="item.image" [src]="item.image" class="item-img w-100"
    onerror="this.src='https://placehold.co/300x150?text=Food'">
  <div class="p-3">
    <div class="d-flex justify-content-between align-items-start mb-1">
      <div>
        <span class="veg-dot me-1" [class.non-veg]="!item.veg">{{ item.veg ? '🟢' : '🔴' }}</span>
        <span class="fw-semibold">{{ item.name }}</span>
      </div>
      <span class="fw-bold text-success">₹{{ item.price }}</span>
    </div>
    <p class="text-muted small mb-2" *ngIf="item.description">{{ item.description }}</p>
    <div class="d-flex justify-content-between align-items-center">
      <small class="text-muted" *ngIf="item.preparationTime">⏱ {{ item.preparationTime }} min</small>
      <div *ngIf="item.available">
        <div *ngIf="qty === 0">
          <button class="btn btn-outline-success btn-sm px-3" (click)="add()">Add</button>
        </div>
        <div *ngIf="qty > 0" class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-danger btn-sm" (click)="remove()">−</button>
          <span class="fw-bold">{{ qty }}</span>
          <button class="btn btn-outline-success btn-sm" (click)="add()">+</button>
        </div>
      </div>
      <span class="badge bg-secondary small" *ngIf="!item.available">Unavailable</span>
    </div>
  </div>
</div>
