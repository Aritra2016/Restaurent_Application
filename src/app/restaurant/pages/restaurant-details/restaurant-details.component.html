<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-4 d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-light btn-sm" routerLink="/home">← Back</button>
    <h5 class="text-white mb-0">🍽️ Restaurant Details</h5>
  </div>
</nav>

<!-- Loading -->
<div class="text-center py-5" *ngIf="loading">
  <div class="spinner-border text-primary"></div>
  <p class="mt-2 text-muted">Loading...</p>
</div>

<div class="container-fluid px-4 mt-3" *ngIf="!loading && restaurant">

  <!-- Banner -->
  <app-restaurant-header [restaurant]="restaurant"></app-restaurant-header>

  <div class="row g-4 mt-1">

    <!-- Left: Menu + Info -->
    <div class="col-lg-8">

      <!-- Offers -->
      <app-restaurant-offers [restaurant]="restaurant"></app-restaurant-offers>

      <!-- Info -->
      <app-restaurant-info [restaurant]="restaurant"></app-restaurant-info>

      <!-- Menu -->
      <h5 class="fw-bold mb-3">📋 Menu</h5>
      <div *ngIf="menuItems.length === 0" class="text-muted">No menu items available.</div>
      <app-menu-category
        *ngFor="let cat of categories"
        [category]="cat"
        [items]="getItemsByCategory(cat)"
        [restaurantId]="restaurant.id">
      </app-menu-category>

      <!-- Reviews -->
      <app-restaurant-review [restaurantId]="restaurant.id"></app-restaurant-review>

    </div>

    <!-- Right: Cart -->
    <div class="col-lg-4">
      <app-cart-summary></app-cart-summary>
    </div>

  </div>
</div>
