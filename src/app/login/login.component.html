<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="logIn()" novalidate>

      <div class="form-group">
        <label>Email Address</label>
        <input formControlName="email" type="email" class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched" placeholder="you@example.com">
        <div class="invalid-feedback">
          <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
          <span *ngIf="f['email'].errors?.['email']">Enter a valid email.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" class="form-control"
            [class.is-invalid]="f['password'].invalid && f['password'].touched" placeholder="Your password">
          <button type="button" class="btn btn-outline-secondary toggle-btn" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <div class="field-error" *ngIf="f['password'].invalid && f['password'].touched">
          <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
  </div>
</div>
